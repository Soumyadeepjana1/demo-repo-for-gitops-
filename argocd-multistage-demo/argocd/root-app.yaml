apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Soumyadeepjana1/demo-repo-for-gitops-.git
    targetRevision: master
    path: argocd-multistage-demo/argocd/children
    directory:
      recurse: true

  destination:
    server: https://192.168.49.2:8443
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
