apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dev-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Soumyadeepjana1/demo-repo-for-gitops-.git
    targetRevision: master
    path: argocd-multistage-demo/apps

  destination:
    server: https://192.168.49.2:8443
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
