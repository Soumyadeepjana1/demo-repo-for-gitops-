apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-shop
  template:
    metadata:
      labels:
        app: online-shop
    spec:
      containers:
        - name: online-shop
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Welcome to Online Shop"
          ports:
            - containerPort: 5678
